name: watchgrid

services:
  # ---------------------------------------------------------------------------
  # Backend API & Threat Engine (FastAPI + Embedded SQLite)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchgrid-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/watchgrid.db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-security-jwt-key-watchgrid-cyber-defense-soc-2026-xyz}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AGENT_API_KEY: ${AGENT_API_KEY:-watchgrid-agent-key-alpha-99}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - watchgrid_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - watchgrid-network

  # ---------------------------------------------------------------------------
  # SOC Operations Console (Next.js 14)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: watchgrid-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - watchgrid-network

  # ---------------------------------------------------------------------------
  # Endpoint Security Agent (Optional Simulation Profile)
  # Activated with: docker compose --profile agent up
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: watchgrid-agent
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      WATCHGRID_API_URL: http://backend:8000
      WATCHGRID_API_KEY: ${AGENT_API_KEY:-watchgrid-agent-key-alpha-99}
      WATCHGRID_DEVICE_ID: ${WATCHGRID_DEVICE_ID:-DEV-DOCKER-AGENT-01}
      WATCHGRID_DEVICE_NAME: ${WATCHGRID_DEVICE_NAME:-Docker SOC Sensor Node}
      WATCHGRID_HEARTBEAT_INTERVAL: ${WATCHGRID_HEARTBEAT_INTERVAL:-15}
    command: ["python", "agent.py", "--daemon"]
    profiles:
      - agent
      - demo
      - all
    networks:
      - watchgrid-network

# -----------------------------------------------------------------------------
# Storage Volumes (Persistent SQLite Database)
# -----------------------------------------------------------------------------
volumes:
  watchgrid_data:
    name: watchgrid_data

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  watchgrid-network:
    name: watchgrid_network
    driver: bridge
